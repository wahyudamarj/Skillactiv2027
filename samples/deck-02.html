<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideation & Identifying a Problem · Grade 12 deck</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#0E1716;color:#EEF3F1;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  .stage{flex:1;display:grid;place-items:center;padding:16px;min-height:0}
  .slide{width:min(100%,calc((100vh - 96px) * 16 / 9));aspect-ratio:720/405;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
  .slide img{width:100%;height:100%;display:block}
  .bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px 18px;font:13px/1 ui-monospace,monospace;letter-spacing:.06em}
  button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(238,243,241,.25);background:none;color:inherit;font-size:18px;cursor:pointer}
  button:disabled{opacity:.3;cursor:default}
  .count{min-width:70px;text-align:center;color:#C3CECA}
</style>
</head>
<body>
<div class="stage"><div class="slide"><img id="s" alt="Slide"></div></div>
<div class="bar"><button id="prev" aria-label="Previous slide">←</button><span class="count" id="n"></span><button id="next" aria-label="Next slide">→</button></div>
<script>
  // 44-slide Grade 12 deck, rendered from the original slides. Arrow keys, Home and End work too.
  const TOTAL = 44, obj = document.getElementById("s"), n = document.getElementById("n");
  let i = 1;
  const pad = (k) => String(k).padStart(2, "0");
  function show(k) {
    i = Math.min(TOTAL, Math.max(1, k));
    obj.src = `media/deck-02/${pad(i)}.jpg`; obj.alt = `Slide ${i} of ${TOTAL}`;
    n.textContent = `${pad(i)} / ${TOTAL}`;
    document.getElementById("prev").disabled = i === 1;
    document.getElementById("next").disabled = i === TOTAL;
    if (i < TOTAL) { const pre = new Image(); pre.src = `media/deck-02/${pad(i + 1)}.jpg`; }
  }
  document.getElementById("prev").onclick = () => show(i - 1);
  document.getElementById("next").onclick = () => show(i + 1);
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") show(i + 1);
    if (e.key === "ArrowLeft" || e.key === "PageUp") show(i - 1);
    if (e.key === "Home") show(1);
    if (e.key === "End") show(TOTAL);
  });
  show(1);
</script>
</body>
</html>
